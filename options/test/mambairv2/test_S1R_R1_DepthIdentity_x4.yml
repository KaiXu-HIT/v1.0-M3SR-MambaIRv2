network_g:
  type: RGBDepthResidualMambaIRv2
  upscale: 4
  in_chans: 3
  depth_in_chans: 1
  img_size: 64
  img_range: 1.0
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  # Stage1R R1-A: warm-start the exact best baseline; only adapter keys may miss.
  pretrain_network_g: /home/BRAIN/xukai/code/v1.0-M3SR-MambaIRv2/experiments/v1.0_RGB_MambaIRv2_x4/models/net_g_490000.pth
  param_key_g: params
  strict_load_g: false

val:
  save_img: false
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

dist_params:
  backend: nccl
  port: 31004
