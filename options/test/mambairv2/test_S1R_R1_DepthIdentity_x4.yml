# Stage1R R1-A: gate-zero Depth Identity Adapter, evaluation only.
name: test_S1R_R1_DepthIdentity_x4
model_type: RGBDepthResidualMambaIRv2Model
scale: 4
num_gpu: 1
manual_seed: 10

datasets:
  test_1:
