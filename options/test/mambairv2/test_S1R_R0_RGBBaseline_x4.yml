# Stage1R R0-A: reproduce the frozen v1.0 RGB baseline without any model change.
name: test_S1R_R0_RGBBaseline_x4
model_type: MambaIRv2Model
scale: 4
num_gpu: 1
manual_seed: 10

datasets:
  test_1:
    task: SR
    name: Set5
    type: PairedImageDataset
    dataroot_gt:
      - /home/BRAIN/xukai/datasets/M3SR/Set5/raw/Set5/Set5/original
    dataroot_lq:
      - /home/BRAIN/xukai/datasets/M3SR/Set5/raw/Set5/Set5/LRbicx4
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_2:
    task: SR
    name: Set14
    type: PairedImageDataset
    dataroot_gt:
      - /home/BRAIN/xukai/datasets/M3SR/Set14/HR
    dataroot_lq:
      - /home/BRAIN/xukai/datasets/M3SR/Set14/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

  test_3:
    task: SR
    name: B100
    type: PairedImageDataset
    dataroot_gt:
      - /home/BRAIN/xukai/datasets/M3SR/B100/HR
    dataroot_lq:
      - /home/BRAIN/xukai/datasets/M3SR/B100/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

  test_4:
    task: SR
    name: Urban100
    type: PairedImageDataset
    dataroot_gt:
      - /home/BRAIN/xukai/datasets/M3SR/Urban100/HR
    dataroot_lq:
      - /home/BRAIN/xukai/datasets/M3SR/Urban100/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

  test_5:
    task: SR
    name: Manga109
    type: PairedImageDataset
    dataroot_gt:
      - /home/BRAIN/xukai/datasets/M3SR/Manga109/HR
    dataroot_lq:
      - /home/BRAIN/xukai/datasets/M3SR/Manga109/LR_bicubic/X4
    filename_tmpl: '{}_LRBI_x4'
    io_backend:
      type: disk

network_g:
  # Stage1R R0-A: this block is byte-for-value equivalent to the v1.0 test.
  type: MambaIRv2
  upscale: 4
  in_chans: 3
  img_size: 64
  img_range: 1.0
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv

path:
  # Stage1R R0-A correction: the reported best v1.0 result uses 490k.
  pretrain_network_g: /home/BRAIN/xukai/code/v1.0-M3SR-MambaIRv2/experiments/v1.0_RGB_MambaIRv2_x4/models/net_g_490000.pth
  param_key_g: params
  strict_load_g: true

val:
  save_img: false
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

dist_params:
  backend: nccl
  port: 30904
